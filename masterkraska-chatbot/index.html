<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Мастер Краска — Чат-бот</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chatbot">

        <!-- ШАПКА -->
        <div class="chat-header">
            <div>
                <h2>Мастер Краска</h2>
                <span>Помощник на сайте</span>
            </div>
        </div>


        <!-- ЧАТ -->
        <div class="chat-messages" id="chatMessages">

            <div class="message bot-message">
                Здравствуйте! Я помощник «Мастер Краски».
                Помогу подобрать направление, найти магазин
                или передать вопрос специалисту.
                Что вас интересует?
            </div>


            <!-- ГЛАВНОЕ МЕНЮ -->
            <div class="buttons" id="mainButtons">

                <button onclick="startScenario('paint')">
                    Подобрать краску
                </button>

                <button onclick="startScenario('tinting')">
                    Колеровка и цвет
                </button>

                <button onclick="startScenario('price')">
                    Цена и наличие
                </button>

                <button onclick="startScenario('shop')">
                    Найти магазин
                </button>

                <button onclick="startScenario('delivery')">
                    Доставка и оплата
                </button>

                <button onclick="startScenario('partner')">
                    Дизайнерам и партнёрам
                </button>

                <button onclick="startScenario('manager')">
                    Позвать менеджера
                </button>

            </div>

        </div>


        <!-- ПОЛЕ ВВОДА -->
        <div class="chat-input">

            <input
                type="text"
                id="userInput"
                placeholder="Введите сообщение..."
            >


            <!-- ВЫБОР ФОТО / ФАЙЛА -->
            <input
                type="file"
                id="fileInput"
                accept="image/*,.pdf"
                style="display: none;"
            >


            <!-- КНОПКА ПРИКРЕПИТЬ -->
<button
    type="button"
    id="attachButton"
    onclick="document.getElementById('fileInput').click()"
    title="Прикрепить фото или файл"
>
    <!-- ВМЕСТО ЭМОДЗИ ВСТАВЛЯЕТСЯ СТАНДАРТНЫЙ SVG -->
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 17.97 8.8l-8.58 8.57a2 2 0 0 1-2.83-2.83l7.87-7.87"></path>
    </svg>
</button>


            <!-- ОТПРАВИТЬ -->
            <button
                type="button"
                onclick="sendMessage()"
            >
                Отправить
            </button>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
